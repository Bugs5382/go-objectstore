name: Integration (MinIO)
# The s3store tests run against a real MinIO container through testcontainers
# (build tag "integration"), so the S3 backend is proven on every PR, not only
# on a laptop. Pull requests only, and not while the PR is a draft.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  integration:
    name: 🪣 Integration (MinIO)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags integration -race -count=1 ./...
